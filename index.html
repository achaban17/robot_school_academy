<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Robot School System</title>
<link rel="icon" type="image/png" href="assets/mark.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A44DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RS System">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --blue:#0A44DC; --blue2:#0636B5; --blue3:#062A8C; --sky:#E8EEFF; --sky2:#D3DFFF;
  --bg:#F4F7FF; --panel:#FFFFFF; --panel2:#F7F9FF; --line:#DCE4F7; --line2:#E9EEFA;
  --ink:#0B1A3F; --ink2:#44507A; --ink3:#7C87A8;
  --accent:#0A44DC; --accent-ink:#FFFFFF; --accent-soft:#E8EEFF;
  --good:#12805C; --good-soft:#DDF4EA; --bad:#C8352B; --bad-soft:#FCE3E0; --warn:#B7650B; --warn-soft:#FFF0DA;
  --yellow:#FFC400; --red:#F2552C; --green:#12A37F;
  --shadow:0 1px 2px rgba(10,68,220,.06),0 8px 24px rgba(10,68,220,.08);
  --f-display:'Montserrat','Arial',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060C1F; --panel:#0D1530; --panel2:#111B3B; --line:#22305A; --line2:#1A264A;
  --ink:#E8EDFF; --ink2:#A9B5DA; --ink3:#7381AA; --sky:#16245A; --sky2:#203275;
  --accent:#7FA0FF; --accent-ink:#06102E; --accent-soft:#16245A;
  --good:#4FD3A0; --good-soft:#0F3328; --bad:#FF8A7E; --bad-soft:#3D1A17; --warn:#FFB55C; --warn-soft:#3A2810;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060C1F; --panel:#0D1530; --panel2:#111B3B; --line:#22305A; --line2:#1A264A;
  --ink:#E8EDFF; --ink2:#A9B5DA; --ink3:#7381AA; --sky:#16245A; --sky2:#203275;
  --accent:#7FA0FF; --accent-ink:#06102E; --accent-soft:#16245A;
  --good:#4FD3A0; --good-soft:#0F3328; --bad:#FF8A7E; --bad-soft:#3D1A17; --warn:#FFB55C; --warn-soft:#3A2810;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:30px;font-weight:900} h2{font-size:22px;font-weight:800} h3{font-size:17.5px;font-weight:800} h4{font-size:15px;font-weight:700}
a{color:var(--accent)} p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd,pre{font-family:var(--f-mono);font-size:.9em}
kbd{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;background:var(--panel2);font-size:.82em;white-space:nowrap}
code{background:var(--accent-soft);padding:1px 6px;border-radius:6px}
pre{background:#0B1A3F;color:#E8EDFF;padding:14px 16px;border-radius:14px;overflow:auto;line-height:1.5;margin:0 0 1em}
pre code{background:none;padding:0;color:inherit}
.hide{display:none!important}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--f-display);font-size:14px;letter-spacing:.01em;transition:transform .08s,background .15s;text-decoration:none}
.btn:hover{background:var(--blue2)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.good{background:var(--good);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);outline:none;transition:border .15s}
.input:focus{border-color:var(--accent);background:var(--panel)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login-hero{background:var(--blue);color:#fff;padding:48px 56px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:28px}
.login-hero img.logo{width:240px;max-width:70%}
.login-hero h1{font-size:40px;color:#fff;max-width:560px}
.login-hero p{color:#D7E1FF;font-size:17px;max-width:540px}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;position:relative;z-index:1}
.dir{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:16px}
.dir b{display:block;font-family:var(--f-display);font-size:15px;margin:8px 0 2px}
.dir span{font-size:13px;color:#D7E1FF}
.dir .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.studs{position:absolute;right:-60px;bottom:-40px;width:340px;height:220px;background:#2A5FF0;border-radius:28px;transform:rotate(-12deg);opacity:.6}
.studs::before,.studs::after{content:"";position:absolute;top:-34px;width:84px;height:44px;border-radius:14px 14px 0 0;background:inherit}
.studs::before{left:40px}.studs::after{left:170px}
.login-side{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:100%;max-width:460px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.seg button{border:0;background:none;border-radius:999px;padding:10px;font-weight:700;cursor:pointer;color:var(--ink2);font-family:var(--f-display)}
.seg button.on{background:var(--blue);color:#fff}
.beta-banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:16px;border:1px dashed var(--warn)}
@media (max-width:900px){.login{grid-template-columns:1fr}.login-hero{padding:32px 20px}.login-hero h1{font-size:28px}.dirs{grid-template-columns:1fr}}

/* ---------- app ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.side .logo{width:170px;margin:4px 8px 18px}
:root[data-theme="dark"] .side .logo{content:url(assets/logo-white.png)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side .logo{content:url(assets/logo-white.png)}}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--ink2);text-decoration:none;font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.navgrp{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 4px 30px;text-align:left;font-family:var(--f-body)}
.navgrp:hover{color:var(--ink)}
.chev{display:inline-block;transition:transform .15s;font-size:12px}.chev.shut{transform:rotate(-90deg)}
.cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:0 7px;letter-spacing:0}
.navrow{display:flex;align-items:center;gap:4px}.navrow .nav{flex:1}
.navtog{border:0;background:none;cursor:pointer;width:34px;height:34px;border-radius:10px;color:var(--ink2)}.navtog:hover{background:var(--panel2)}
.video-wrap{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000;margin-bottom:10px}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.sim-meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.sim-m{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px}
.sim-m b{display:block;font-family:var(--f-display);font-size:18px}
.sim-m i{font-style:normal;font-size:12px;font-weight:700;margin-left:6px}.sim-m i.up{color:var(--good)}.sim-m i.dn{color:var(--bad)}
.sim-m .bar{height:5px;margin-top:5px}
.sim-steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}.sim-steps span{height:6px;flex:1;min-width:16px;border-radius:9px;background:var(--line2)}.sim-steps span.on{background:var(--accent)}.sim-steps span.done{background:var(--good)}
@media (max-width:700px){.sim-meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nav.sub{padding:7px 12px 7px 44px;font-size:14px;font-weight:500}
.nav .sw{width:10px;height:10px;border-radius:3px;flex:none}
.side .me{margin-top:auto;padding:14px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.side .me b{display:block;font-size:14px}
.main{min-width:0;padding:28px 36px 60px;max-width:1240px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.burger{display:none}
.mode-chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--warn-soft);color:var(--warn)}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .main{padding:18px 16px 60px}
}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:900}
.kpi .l{font-size:13px;color:var(--ink2)}
.hello{background:var(--blue);color:#fff;border:0;position:relative;overflow:hidden}
.hello h1{color:#fff}.hello p{color:#D7E1FF}
.hello .studs{right:-90px;bottom:-110px;opacity:.5}

/* course cards */
.ccard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;padding:0}
.ccard:hover{transform:translateY(-2px)}
.ccard .head{padding:20px 22px 18px;color:#fff;position:relative;min-height:126px}
.ccard .head h3{color:inherit;font-size:21px;margin:8px 0 2px}
.ccard .head .k{font-size:13px;opacity:.9}
.ccard .body{padding:0 22px 20px;display:flex;flex-direction:column;gap:10px}
.brick{position:absolute;right:18px;top:18px;width:54px;height:30px;border-radius:7px;background:rgba(255,255,255,.25)}
.brick::before,.brick::after{content:"";position:absolute;top:-8px;width:14px;height:9px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.25)}
.brick::before{left:8px}.brick::after{right:8px}

/* course page */
.chead{border-radius:24px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px}
.chead h1{color:inherit;margin-bottom:6px}
.chead .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chead .meta span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:var(--f-display);font-size:14px;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--accent);border-color:var(--accent)}
.tab .ok{width:8px;height:8px;border-radius:99px;background:var(--good)}
.path{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.step i{width:18px;height:18px;border-radius:99px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.step.done{border-color:var(--good);color:var(--good)} .step.done i{background:var(--good);border-color:var(--good);color:#fff}

/* prose */
.prose{max-width:860px}
.prose h2{margin-top:1.4em} .prose h3{margin-top:1.3em}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 1em} .prose li{margin:.25em 0}
.prose table{border-collapse:collapse;width:100%;margin:0 0 1.1em;font-size:14.5px}
.prose th,.prose td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--panel2);font-weight:700}
.callout{border-radius:16px;padding:14px 16px 4px;margin:0 0 1em;border:1px solid var(--line);background:var(--panel2)}
.callout>b:first-child{display:block;font-family:var(--f-display);margin-bottom:6px}
.callout.tip{background:var(--good-soft);border-color:transparent}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.info{background:var(--accent-soft);border-color:transparent}
.ftype{display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:start;margin-bottom:14px}
.ftype .ic{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:22px;color:#fff}
.excerpt{position:relative;max-width:640px;margin:0 0 1.2em;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;user-select:none;-webkit-user-select:none}
.excerpt img{display:block;width:100%;pointer-events:none}
.excerpt .wm{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.excerpt .wm div{position:absolute;inset:-50%;transform:rotate(-22deg);font-size:13px;font-weight:700;color:rgba(200,53,43,.11);line-height:46px;white-space:pre;letter-spacing:.05em}
.excerpt figcaption{padding:10px 14px;font-size:13px;color:#44507A;background:#F7F9FF;border-top:1px solid #DCE4F7}
.quote{border-left:4px solid var(--accent);padding:6px 0 6px 16px;margin:0 0 1em;color:var(--ink2)}
.protected{user-select:none;-webkit-user-select:none}
@media print{.excerpt,.protected{display:none!important}}

/* plan table */
.plan{width:100%;border-collapse:separate;border-spacing:0 8px}
.plan td{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;vertical-align:top}
.plan td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;width:56px;text-align:center;font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--accent)}
.plan td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
.plan .nm{font-family:var(--f-display);font-weight:800}
.plan details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:700;margin-top:6px}
.plan .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.blockhead td{background:transparent!important;border:0!important;padding:16px 4px 2px!important;font-family:var(--f-display);font-weight:800;color:var(--ink2)!important;font-size:14px!important;text-align:left!important;width:auto!important}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* items (trainers/tests) */
.item{display:flex;gap:16px;align-items:flex-start}
.item .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.item .ic svg{width:26px;height:26px}
.status{font-size:12.5px;font-weight:700}
.runner{max-width:900px}
.q{padding:18px 20px;margin-bottom:14px}
.q .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ex{font-size:14px;color:var(--ink2);margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.result{padding:22px;border-radius:20px;margin-bottom:18px}
.result.pass{background:var(--good-soft)} .result.fail{background:var(--warn-soft)}
.result .big{font-family:var(--f-display);font-size:40px;font-weight:900}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0B1A3F;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;box-shadow:var(--shadow);font-size:14px;max-width:92vw}
.overlay{position:fixed;inset:0;background:rgba(6,12,31,.5);z-index:25}
.empty{padding:30px;text-align:center;color:var(--ink2)}
/* trainers shared */
.tr-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.tr-row.ok{border-color:var(--good);background:var(--good-soft)} .tr-row.no{border-color:var(--bad);background:var(--bad-soft)}
.tr-row .grow{min-width:0}
.ord-btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}
.tr-canvas{background:#fff;border-radius:14px;border:1px solid var(--line);max-width:100%;touch-action:none}
.code{width:100%;min-height:260px;font-family:var(--f-mono);font-size:13.5px;line-height:1.5;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#0B1A3F;color:#E8EDFF;tab-size:4;resize:vertical}
.console{font-family:var(--f-mono);font-size:12.5px;background:#06102E;color:#B9C6F0;border-radius:12px;padding:10px 12px;min-height:46px;max-height:160px;overflow:auto;white-space:pre-wrap}
.console .e{color:#FF8A7E}
.blocks{display:flex;flex-wrap:wrap;gap:8px}
.wblock{border:0;border-radius:12px;padding:9px 12px;font-weight:700;color:#fff;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;padding:10px;border-radius:14px;border:2px dashed var(--line);background:var(--panel2);align-items:center}
.prog .wblock{position:relative;padding-right:26px}
.prog .wblock .x{position:absolute;right:6px;top:3px;font-size:12px;opacity:.8}

<script>
/* ======================================================================
   Robot School Academy — оболонка платформи
   ====================================================================== */
(function(){
'use strict';
const CFG = window.RS_CONFIG || {MODE:'beta'};
const BETA = CFG.MODE !== 'prod';
const PASS = CFG.PASS_PERCENT || 80;
const COURSES = (window.RS_COURSES || []);
const BASE = window.RS_METHOD;              // методична база (спільна для всіх курсів)
const ALL = BASE ? [BASE].concat(COURSES) : COURSES;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.RS_ESC = esc;

/* ---------- SHA-256 (для хешування пароля в браузері) ---------- */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a))}
  const enc=unescape(encodeURIComponent(ascii)); const words=[]; const L=enc.length*8;
  const H=[],K=[]; let p=0;
  for(let c=2;p<64;c++){let isP=true;for(let d=2;d*d<=c;d++){if(c%d===0){isP=false;break}} if(isP){if(p<8)H[p]=(Math.pow(c,.5)*4294967296)|0;K[p++]=(Math.pow(c,1/3)*4294967296)|0}}
  let s=enc+'\x80'; while(s.length%64-56) s+='\x00';
  for(let i=0;i<s.length;i++){const j=s.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((L/4294967296)|0); words[words.length]=L;
  let hash=H.slice(0);
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16); const old=hash.slice(0);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2]; const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+K[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0; hash.length=8;
    }
    for(let i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  let out=''; for(let i=0;i<8;i++) for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255; out+=(b<16?'0':'')+b.toString(16)}
  return out;
}
const pwHash = (email,pw)=>sha256('rs-academy|'+email.trim().toLowerCase()+'|'+pw);

/* ---------- сховище ---------- */
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const KEY = BETA ? 'rsa_beta_' : 'rsa_';
let S = { user:null, progress:{}, route:'home' };

/* ---------- API: бета (локально) або Google Apps Script ---------- */
async function callApi(payload){
  if(!CFG.API_URL) throw new Error('Не вказано адресу Google Apps Script (API_URL у config.js).');
  const r = await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'Помилка сервера');
  return j;
}
const API = {
  async register(p){
    if(BETA){
      const users = LS.get(KEY+'users',{});
      if(users[p.email]) throw new Error('Учитель з такою поштою вже зареєстрований. Увійдіть.');
      users[p.email] = {profile:{fio:p.fio,email:p.email,phone:p.phone,branch:p.branch,registered:new Date().toISOString()}, hash:p.hash};
      LS.set(KEY+'users',users);
      return {user:users[p.email].profile, token:'beta', progress:{}};
    }
    const j = await callApi({action:'register',fio:p.fio,email:p.email,phone:p.phone,branch:p.branch,hash:p.hash});
    return {user:j.user, token:j.token, progress:j.progress||{}};
  },
  async login(email,hash){
    if(BETA){
      const u = LS.get(KEY+'users',{})[email];
      if(!u || u.hash!==hash) throw new Error('Невірна пошта або пароль.');
      return {user:u.profile, token:'beta', progress:LS.get(KEY+'progress_'+email,{})};
    }
    const j = await callApi({action:'login',email,hash});
    return {user:j.user, token:j.token, progress:j.progress||{}};
  },
  async save(rec){
    if(BETA||S.admin) return true;
    const out = LS.get(KEY+'outbox',[]); out.push(rec); LS.set(KEY+'outbox',out);
    return flushOutbox();
  }
};
/* ---------- повідомлення методисту, правки адміністратора ---------- */
Object.assign(API,{
  async branches(){ if(BETA) return CFG.BRANCHES; try{ const j=await callApi({action:'meta'}); if(j.branches&&j.branches.length){ LS.set('rsa_branches',j.branches); return j.branches } }catch(e){} return LS.get('rsa_branches',CFG.BRANCHES) },
  async sendMessage(m){
    if(BETA){ const all=LS.get(KEY+'messages',[]); const rec=Object.assign({id:Math.random().toString(16).slice(2,10),at:new Date().toISOString(),fio:S.user.fio,email:S.user.email,branch:S.user.branch,status:'Нове',reply:'',replyAt:''},m); all.push(rec); LS.set(KEY+'messages',all); return rec }
    const j=await callApi(Object.assign({action:'message',email:S.user.email,token:S.token},m)); return j.message;
  },
  async myMessages(){
    if(BETA) return LS.get(KEY+'messages',[]).filter(x=>x.email===S.user.email);
    const j=await callApi({action:'myMessages',email:S.user.email,token:S.token}); return j.messages||[];
  },
  async getEdits(){
    if(BETA) return LS.get(KEY+'edits',{});
    try{ const j=await callApi({action:'getEdits'}); LS.set(KEY+'edits',j.edits||{}); return j.edits||{} }catch(e){ return LS.get(KEY+'edits',{}) }
  },
  async adminLogin(login,hash){
    if(BETA){ if(login!==(CFG.ADMIN_LOGIN||'robotschool')||hash!==CFG.ADMIN_HASH) throw new Error('Невірний логін або пароль адміністратора.'); return {token:'beta-admin',exp:Date.now()+12*3600e3} }
    const j=await callApi({action:'adminLogin',login,hash}); return {token:j.token,exp:Date.now()+12*3600e3};
  },
  async adminCall(action,extra){
    if(BETA) throw new Error('beta');
    try{ return await callApi(Object.assign({action,adminToken:S.adminToken},extra||{})) }
    catch(e){ if(/Сесія адміністратора/.test(e.message)){ toast(e.message); signOut() } throw e }
  },
  async saveEdits(diff){

  }
});

function courseItems(c){
  const items=[];
  (c.tabs||[]).forEach(t=>{ if(t.read) items.push({id:'read:'+t.id,kind:'read',title:t.title,tab:t.id}) });
  (c.trainers||[]).forEach(t=>items.push({id:t.id,kind:'trainer',title:t.title,tab:'trainers'}));
  (c.tests||[]).forEach(t=>items.push({id:t.id,kind:'test',title:t.title,tab:'tests',final:!!t.final}));
  return items;
}
function prog(cid){ return S.progress[cid] || (S.progress[cid]={}) }
function isDone(cid,iid){ const r=prog(cid)[iid]; return !!(r && r.passed) }
function coursePct(c){ const it=courseItems(c); if(!it.length) return 0; return Math.round(100*it.filter(i=>isDone(c.id,i.id)).length/it.length) }
function courseComplete(c){ return courseItems(c).every(i=>isDone(c.id,i.id)) }
function record(c,item,score,max,extra){
  const percent = max ? Math.round(100*score/max) : 100;
  const passed = item.kind==='read' ? true : percent>=PASS;
  const p = prog(c.id); const prev = p[item.id];
  const rec = {course:c.id,courseTitle:c.title,item:item.id,itemTitle:item.title,kind:item.kind,score,max,percent,passed,at:new Date().toISOString(),attempts:(prev&&prev.attempts||0)+1};
  if(extra) rec.note = extra;
  if(!prev || percent>=prev.percent || passed&&!prev.passed) p[item.id]=rec; else { prev.attempts=rec.attempts; }
  rec.coursePercent = coursePct(c); rec.courseDone = courseComplete(c);
  LS.set(KEY+'progress_'+S.user.email,S.progress);
  if(!S.admin) API.save(rec);
  return rec;
}
window.RS_RECORD = function(courseId,itemId,score,max,extra){
  const c = ALL.find(x=>x.id===courseId); if(!c) return;
  const it = courseItems(c).find(i=>i.id===itemId); if(!it) return;
  const r = record(c,it,score,max,extra);
  toast(r.passed ? (it.kind==='read'?'Позначено як опрацьоване ✓':'Зараховано: '+r.percent+'% ✓') : 'Результат '+r.percent+'%. Для зарахування потрібно '+PASS+'%.');
  return r;
};

function signIn(res){

  if(S.admin){ location.hash='#/admin'; route(); } else if(!location.hash || location.hash==='#' || /^#\/admin/.test(location.hash)) location.hash='#/home'; else route();
  flushOutbox();
}
function mergeProgress(a,b){
  const out=JSON.parse(JSON.stringify(a||{}));
  Object.keys(b||{}).forEach(c=>{ out[c]=out[c]||{}; Object.keys(b[c]).forEach(i=>{ const x=out[c][i], y=b[c][i]; if(!x || (y.percent||0)>(x.percent||0) || (y.passed&&!x.passed)) out[c][i]=y }) });
  return out;
}

function dirsOf(){
  const D=(CFG.DIRS||[]).map(d=>Object.assign({},d,{list:COURSES.filter(c=>c.dir===d.key).sort((a,b)=>(a.order||0)-(b.order||0))}));
  const rest=COURSES.filter(c=>!D.some(d=>d.key===c.dir)); if(rest.length) D.push({key:'other',title:'Інші',list:rest});
  return D.filter(d=>d.list.length);
}
function groupedCourses(){
  return dirsOf().map(d=>{ const done=d.list.filter(courseComplete).length;
    return `<div class="row" style="margin:26px 0 12px"><h2 style="margin:0">${esc(d.title)}</h2><span class="pill">${d.list.length} ${d.list.length===1?'курс':d.list.length<5?'курси':'курсів'}</span>${done?`<span class="pill good">завершено: ${done}</span>`:''}</div>
    <div class="grid g3">${d.list.map(courseCard).join('')}</div>` }).join('');
}

/* ---------- сторінка курсу ---------- */
function viewCourse(cid, tabId, sub){
  const c = ALL.find(x=>x.id===cid); if(!c){ location.hash='#/courses'; return }
  const tabs = c.tabs;
  const tab = tabs.find(t=>t.id===tabId) || tabs[0];
  const items = courseItems(c);
  const pct = coursePct(c);
  const tabDone = t => t.read ? isDone(c.id,'read:'+t.id) : (t.render==='trainers' ? (c.trainers||[]).every(x=>isDone(c.id,x.id)) : t.render==='tests' ? (c.tests||[]).every(x=>isDone(c.id,x.id)) : false);
  let body='';
  if(sub && tab.render==='trainers') body = '<div id="runner" class="runner"></div>';
  else if(sub && tab.render==='tests') body = '<div id="runner" class="runner"></div>';
  else body = renderTab(c,tab);
  shell(c.id==='method'?'c:method':'c:'+c.id,`
    <div class="chead" style="background:${c.color};color:${c.headInk||'#fff'}"><div class="studs" style="opacity:.14;background:#fff"></div>
      <div class="pill" style="background:rgba(255,255,255,.22);color:inherit">${esc(c.direction)}</div>
      <h1 style="margin-top:10px">${esc(c.title)}</h1><div style="opacity:.92">${esc(c.subtitle)}</div>
      <div class="meta">${(c.meta||[]).map(m=>`<span>${esc(m)}</span>`).join('')}</div>
      <div class="row" style="margin-top:16px;max-width:520px"><div class="bar grow" style="background:rgba(255,255,255,.3)"><i style="width:${pct}%;background:${c.headInk||'#fff'}"></i></div><b>${pct}%</b></div>
    </div>
    <details class="card" style="padding:12px 18px;margin-bottom:16px" ${pct===0?'':''}><summary style="cursor:pointer;font-weight:700;font-family:var(--f-display)">Маршрут курсу: виконано ${items.filter(i=>isDone(c.id,i.id)).length} з ${items.length} кроків <span class="tiny" style="font-weight:500">— розгорнути</span></summary>
      <div class="path" style="margin:12px 0 2px">${items.map(it=>`<span class="step ${isDone(c.id,it.id)?'done':''}" data-go="#/course/${c.id}/${it.tab}${it.kind!=='read'?'/'+it.id:''}"><i>${isDone(c.id,it.id)?'✓':''}</i>${it.kind==='read'?'📖':it.kind==='test'?'📝':'🧩'} ${esc(it.title)}</span>`).join('')}</div></details>
    <div class="tabs">${tabs.map(t=>`<button class="tab ${t.id===tab.id?'on':''}" data-go="#/course/${c.id}/${t.id}">${esc(t.title)}${tabDone(t)?'<span class="ok"></span>':''}</button>`).join('')}</div>
    ${body}
  `);
  bindGo();
  // кнопка «опрацьовано»
  const rb=$('#readbtn'); if(rb) rb.onclick=()=>{ window.RS_RECORD(c.id,'read:'+tab.id,1,1); viewCourse(cid,tab.id) };
  // водяний знак на фрагментах
  document.querySelectorAll('.excerpt').forEach(fig=>{
    const wm=document.createElement('div'); wm.className='wm';
    const line=(S.user.fio+' · '+S.user.email+' · Robot School      ').repeat(6);
    wm.innerHTML='<div>'+esc((line+'\n').repeat(40))+'</div>'; fig.appendChild(wm);
    fig.addEventListener('contextmenu',e=>e.preventDefault());
  });
  document.querySelectorAll('.excerpt img').forEach(im=>im.setAttribute('draggable','false'));
  // фільтри плану
  if(tab.render==='plan') bindPlan(c);
  if(tab.after) try{ tab.after(document.getElementById('view'), c) }catch(e){ console.error(e) }
  if(sub && tab.render==='trainers'){ const tr=(c.trainers||[]).find(t=>t.id===sub); if(tr) runTrainer(c,tr); }
  if(sub && tab.render==='tests'){ const ts=(c.tests||[]).find(t=>t.id===sub); if(ts) runTest(c,ts); }
}
function readFooter(c,t){
  const done=isDone(c.id,'read:'+t.id);
  return `<div class="card row" style="margin-top:26px;max-width:860px">${done?'<span class="pill good">✓ Опрацьовано</span><span class="muted small">Можна повертатися до розділу будь-коли.</span>':`<div class="grow"><b>Прочитали розділ?</b><div class="small muted">Позначте його — це зарахується у ваш прогрес курсу${BETA?'':' і з’явиться в таблиці методиста'}.</div></div><button class="btn" id="readbtn">Опрацьовано ✓</button>`}</div>`;
}
function renderTab(c,t){
  if(t.render==='html') return `<div class="prose ${t.protected?'protected':''}">${typeof t.html==='function'?t.html():t.html}</div>${t.read?readFooter(c,t):''}`;
  if(t.render==='plan') return renderPlan(c,t)+(t.read?readFooter(c,t):'');
  if(t.render==='trainers') return renderItems(c,'trainers');
  if(t.render==='tests') return renderItems(c,'tests');
  if(t.render==='online') return renderOnline(c)+readFooter(c,t);
  if(t.render==='passport') return renderPassport(c)+readFooter(c,t);
  return '';
}

function renderPlan(c,t){

    rows+=`<tr data-b="${bi}" data-k="${l.kind||''}" data-s="${esc((l.name+' '+l.topic+' '+(l.focus||[]).join(' ')).toLowerCase())}"><td>${esc(l.label||l.n)}</td><td>
      <div class="row" style="gap:8px"><span class="nm">${esc(l.name)}</span>${l.kind==='check'?'<span class="pill warn">контроль</span>':''}${l.kind==='project'?'<span class="pill good">проєкт</span>':''}${l.kind==='theme'?'<span class="pill">тематичний</span>':''}${l.folder?`<span class="tiny">папка: ${esc(l.folder)}</span>`:''}</div>
      <div class="muted">${esc(l.topic)}${aiMark(c,l,'topic')}</div>
      ${l.focus&&l.focus.length?`<div class="chips">${l.focus.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div>`:''}

      ${l.tb?`<details class="tbgen"><summary>Конспект учителя${aiMark(c,l,'tb')}</summary>
        <div class="small" style="margin-top:6px">${l.tb.goal?`<p><b>Мета (навчальна):</b> ${esc(l.tb.goal)}</p>`:''}${l.tb.dev?`<p><b>Розвивальна / виховна:</b> ${esc(l.tb.dev)}</p>`:''}${l.tb.type?`<p><b>Тип і форма уроку:</b> ${esc(l.tb.type)}</p>`:''}${l.tb.equip?`<p><b>Обладнання:</b> ${esc(l.tb.equip)}</p>`:''}
        ${l.tb.stages?`<table class="tbst"><tr><th>Етап</th><th>Зміст (дії вчителя й учнів)</th><th>Хв</th></tr>${l.tb.stages.map(s=>`<tr><td><b>${esc(s[0])}</b></td><td>${esc(s[1])}</td><td>${esc(String(s[2]))}</td></tr>`).join('')}</table>`:''}
        ${l.tb.hw?`<p><b>Домашнє завдання:</b> ${esc(l.tb.hw)}</p>`:''}${l.tb.mat?`<p><b>Матеріали для вчителя:</b> ${l.tb.mat}</p>`:''}</div></details>`:''}
      ${(l.know&&l.know.length)||l.tip?`<details><summary>Підготовка вчителя</summary>
        ${l.know&&l.know.length?`<div class="small" style="margin-top:6px"><b>Учитель має знати:</b>${aiMark(c,l,'know')}<ul style="margin:4px 0 6px;padding-left:18px">${l.know.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div>`:''}
        ${l.tip?`<div class="callout tip small" style="margin:6px 0 0"><b>Методична порада</b><p>${l.tip}</p></div>`:''}
      </details>`:''}
    </td></tr>`;
  });

   <div class="filters"><input class="input" id="pq" placeholder="Пошук за темою, механізмом, інструментом…" style="max-width:360px">

   <table class="plan" id="plantbl">${rows}</table>`;

function aiMark(c,l,field){
  if(!S.admin||!l._ai||!l._ai[field]) return '';
  const st=l._ai[field]; const lab=st==='published'?'опубліковано':'чернетка — бачите лише ви';
  return ` <span class="pill ${st==='published'?'good':'warn'}" style="margin-left:6px">✎ ${lab}</span> <a class="tiny" href="#/admin/additions/${c.id}/${encodeURIComponent(c.id+'|'+l.n+'|'+field)}">редагувати</a>`;
}
function bindPlan(){
  const q=$('#pq'), b=$('#pb'); if(!q) return;
  const f=()=>{ const s=q.value.trim().toLowerCase(), bv=b.value;
    document.querySelectorAll('#plantbl tr').forEach(tr=>{
      if(tr.classList.contains('blockhead')){ tr.style.display = (bv===''||tr.dataset.b===bv) && !s ? '' : 'none'; return }
      const ok=(!s||tr.dataset.s.includes(s))&&(bv===''||tr.dataset.b===bv); tr.style.display=ok?'':'none' }) };
  q.oninput=f; b.onchange=f;
}
function itemStatus(c,id){
  const r=prog(c.id)[id];
  if(!r) return '<span class="status muted">Не розпочато</span>';
  return r.passed?`<span class="status" style="color:var(--good)">✓ Зараховано · ${r.percent}%</span>`:`<span class="status" style="color:var(--warn)">Найкраще: ${r.percent}% · спроб: ${r.attempts}</span>`;
}
function renderItems(c,kind){
  const list = c[kind]||[];
  const intro = kind==='tests'
    ? `<p class="muted" style="max-width:860px">Тести перевіряють, чи готові ви до уроку: зміст курсу, методику та роботу з файлами. Зарахування — від ${PASS}%. Після здачі видно пояснення до кожної відповіді; перескладати можна без обмежень, у прогрес іде найкращий результат.</p>`
    : `<p class="muted" style="max-width:860px">Тренажери — це практика «руками»: те, що діти робитимуть на уроці, і те, що вчитель має робити впевнено. Тренажер зараховується, коли ви виконуєте його щонайменше на ${PASS}%.</p>`;
  return intro+`<div class="grid g2">${list.map(x=>`
    <div class="card item"><div class="ic" style="background:${c.soft||'var(--accent-soft)'};color:${c.colorInk||c.color}">${kind==='tests'?I.test:I.trainer}</div>
      <div class="grow"><h3 style="margin-bottom:4px">${esc(x.title)} ${x.final?'<span class="pill warn">підсумковий</span>':''}</h3><p class="small muted">${esc(x.desc||'')}</p>
      <div class="row">${itemStatus(c,x.id)}<span class="grow"></span><button class="btn sm" data-go="#/course/${c.id}/${kind}/${x.id}">${prog(c.id)[x.id]?'Ще раз':'Почати'}</button></div></div></div>`).join('')}</div>`;
}

/* ---------- тест ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
window.RS_SHUFFLE = shuffle;
function runTest(c,t){
  const box=$('#runner');
  const qs = shuffle(t.questions).slice(0,t.take||t.questions.length).map(q=>{ const idx=shuffle(q.o.map((_,i)=>i)); return {q, idx} });
  box.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="btn sm ghost" data-go="#/course/${c.id}/tests">← До тестів</button></div>
   <h2>${esc(t.title)}</h2><p class="muted">${esc(t.desc||'')} · ${qs.length} питань · зарахування від ${PASS}%</p>
   <form id="tf">${qs.map((x,qi)=>`<div class="card q" data-qi="${qi}"><div class="qt">${qi+1}. ${x.q.q}</div>${x.q.code?`<pre><code>${esc(x.q.code)}</code></pre>`:''}
     ${x.idx.map(oi=>`<label class="opt" data-oi="${oi}"><input type="radio" name="q${qi}" value="${oi}"><span>${x.q.o[oi]}</span></label>`).join('')}
     <div class="ex hide"></div></div>`).join('')}
   <div class="row"><button class="btn" type="submit">Завершити тест</button><span class="muted small" id="left"></span></div></form>`;
  bindGo();
  const f=$('#tf');
  const upd=()=>{ const n=qs.filter((_,i)=>f.querySelector(`input[name=q${i}]:checked`)).length; $('#left').textContent=`Відповідей: ${n} з ${qs.length}` }; f.onchange=upd; upd();
  f.onsubmit=e=>{
    e.preventDefault();
    const unanswered = qs.filter((_,i)=>!f.querySelector(`input[name=q${i}]:checked`)).length;
    if(unanswered && !confirm(`Без відповіді: ${unanswered}. Завершити тест?`)) return;
    let score=0;
    qs.forEach((x,qi)=>{
      const el=f.querySelector(`[data-qi="${qi}"]`); const ch=f.querySelector(`input[name=q${qi}]:checked`);
      const v = ch?+ch.value:-1; if(v===x.q.a) score++;
      el.querySelectorAll('.opt').forEach(o=>{ const oi=+o.dataset.oi; if(oi===x.q.a) o.classList.add('right'); else if(oi===v) o.classList.add('wrong'); o.querySelector('input').disabled=true });
      const ex=el.querySelector('.ex'); ex.classList.remove('hide'); ex.innerHTML=(v===x.q.a?'<b style="color:var(--good)">Правильно.</b> ':'<b style="color:var(--bad)">Неправильно.</b> ')+(x.q.ex||'');
    });
    const r = window.RS_RECORD(c.id,t.id,score,qs.length);
    f.querySelector('button[type=submit]').remove();
    const res=document.createElement('div'); res.className='result '+(r.passed?'pass':'fail');
    res.innerHTML=`<div class="big">${r.percent}%</div><div><b>${score} з ${qs.length}</b> — ${r.passed?'тест зараховано.':'поки не зараховано. Перегляньте пояснення нижче й спробуйте ще раз.'}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm" type="button" id="again">Пройти ще раз</button><button class="btn sm ghost" type="button" data-go="#/course/${c.id}/tests">До списку тестів</button></div>`;
    box.insertBefore(res, f); bindGo(); $('#again').onclick=()=>runTest(c,t); window.scrollTo({top:0,behavior:'smooth'});
  };
}
/* ---------- тренажер ---------- */
function runTrainer(c,t){
  const box=$('#runner');
  box.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="btn sm ghost" data-go="#/course/${c.id}/trainers">← До тренажерів</button></div>
   <h2>${esc(t.title)}</h2><p class="muted" style="max-width:820px">${t.intro||esc(t.desc||'')}</p><div id="tr"></div>`;
  bindGo();
  const T = window.RS_TRAINERS && window.RS_TRAINERS[t.type];
  if(!T){ $('#tr').innerHTML='<div class="empty">Тренажер недоступний.</div>'; return }
  T($('#tr'), t, (score,max,note)=>{ const r=window.RS_RECORD(c.id,t.id,score,max,note); return r }, c);
}

/* ---------- профіль / прогрес ---------- */
function viewProfile(){
  const u=S.user;
  const rows = ALL.map(c=>{
    const its=courseItems(c);
    return `<div class="card" style="margin-bottom:14px">
      <div class="row"><span class="sw" style="width:14px;height:14px;border-radius:4px;background:${c.color};display:inline-block"></span><h3 style="margin:0">${esc(c.title)}</h3><span class="grow"></span><b>${coursePct(c)}%</b>
      ${courseComplete(c)&&c.id!=='method'?`<button class="btn sm good" data-cert="${c.id}">Сертифікат</button>`:''}</div>
      <div class="bar" style="margin:10px 0 12px"><i style="width:${coursePct(c)}%;background:${c.color}"></i></div>
      <table class="prose" style="width:100%;font-size:14px;border-collapse:collapse"><tbody>${its.map(it=>{const r=prog(c.id)[it.id];return `<tr style="border-top:1px solid var(--line2)"><td style="padding:7px 4px">${it.kind==='read'?'📖':it.kind==='test'?'📝':'🧩'} ${esc(it.title)}</td><td style="padding:7px 4px;text-align:right">${r?(r.passed?`<span class="pill good">${it.kind==='read'?'опрацьовано':r.percent+'%'}</span>`:`<span class="pill warn">${r.percent}%</span>`):'<span class="tiny">—</span>'}</td><td class="tiny" style="padding:7px 4px;text-align:right;width:110px">${r?new Date(r.at).toLocaleDateString('uk-UA'):''}</td></tr>`}).join('')}</tbody></table>
    </div>`}).join('');
  const out = LS.get(KEY+'outbox',[]).length;
  shell('profile',`<h1>Мій прогрес</h1>
    <div class="card" style="margin-bottom:18px"><div class="grid g4" style="gap:10px">
      <div><div class="tiny">ПІБ</div><b>${esc(u.fio)}</b></div><div><div class="tiny">Філія</div><b>${esc(u.branch)}</b></div>
      <div><div class="tiny">Пошта</div><b>${esc(u.email)}</b></div><div><div class="tiny">Телефон</div><b>${esc(u.phone)}</b></div></div>
      <p class="tiny" style="margin:12px 0 0">${BETA?'Бета-версія: результати зберігаються лише в цьому браузері.':(out?`Очікують надсилання в таблицю: ${out}. Синхронізація повториться автоматично.`:'Усі результати передано в таблицю методиста.')}</p></div>
    ${rows}`);
  document.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>certificate(ALL.find(c=>c.id===b.dataset.cert)));
}
function certificate(c){
  const its=courseItems(c).filter(i=>i.kind==='test'); const p=prog(c.id);
  const avg=Math.round(its.reduce((a,i)=>a+(p[i.id]?p[i.id].percent:0),0)/Math.max(1,its.length));
  const last=Object.values(p).map(r=>r.at).sort().pop();
  const w=window.open('','_blank'); if(!w){toast('Дозвольте спливаючі вікна, щоб відкрити сертифікат');return}
  w.document.write(`<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Сертифікат — ${esc(c.title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Onest:wght@400;600&display=swap"><style>body{font-family:Onest,sans-serif;margin:0;padding:40px;color:#0B1A3F}.c{border:8px solid #0A44DC;border-radius:30px;padding:56px;text-align:center;max-width:900px;margin:auto}h1{font-family:Montserrat;font-weight:900;font-size:40px;margin:26px 0 8px}h2{font-family:Montserrat;font-size:30px;margin:10px 0;color:#0A44DC}p{font-size:17px}</style></head><body><div class="c"><img src="${location.href.split('#')[0].replace(/[^/]*$/,'')}assets/logo.png" style="width:260px"><h1>СЕРТИФІКАТ</h1><p>засвідчує, що викладач</p><h2>${esc(S.user.fio)}</h2><p>філія «${esc(S.user.branch)}»</p><p>опрацював(-ла) методичні матеріали та успішно склав(-ла) тести курсу</p><h2>«${esc(c.title)}»</h2><p>середній результат тестів: <b>${avg}%</b> · дата: <b>${last?new Date(last).toLocaleDateString('uk-UA'):''}</b></p><p style="margin-top:40px;font-size:14px;color:#44507A">Robot School System · Academy — підготовка викладачів</p></div><script>setTimeout(()=>print(),600)<\/script></body></html>`);
  w.document.close();
}
function viewHelp(){
  shell('help',`<div class="prose"><h1>Як працювати з платформою</h1>
  <h3>Рекомендований маршрут</h3>
  <ol><li><b>Методична база</b> — спільні правила для всіх курсів: типи файлів (SB, TB, інструкція), етапи уроку, робота з групою, конфіденційність матеріалів. Тут же тренажер заповнення плану уроку.</li>
  <li><b>Курс</b>, який ви ведете: «Огляд» → «Навчальний план» → «Матеріали курсу» → «Методика» → «Література» (кожен розділ позначайте кнопкою «Опрацьовано»).</li>
  <li><b>Тренажери</b> — відпрацюйте практичні навички (механізми, програмування, інструменти, план уроку).</li>
  <li><b>Тести</b> — поточні та підсумковий. Зарахування від ${PASS}%.</li>
  <li>Після проходження всіх кроків у розділі «Мій прогрес» з’являється <b>сертифікат</b>.</li>
  <li>Питання, пропозиції чи помилку в матеріалах надсилайте через <b>«Написати методисту»</b> — відповідь з’явиться там само.</li></ol>
  <h3>Чого на платформі немає — і чому</h3>
  <p>Тут немає самих файлів уроків (SB, TB, інструкцій). Їх видає методист філії. На платформі є лише короткі фрагменти з водяним знаком, щоб показати, як файли влаштовані. Копіювати, фотографувати й пересилати фрагменти заборонено.</p>
  <h3>Де зберігаються мої результати</h3>
  <p>${BETA?'Це <b>бета-версія</b>: реєстрація й результати зберігаються лише в цьому браузері на цьому пристрої й нікуди не надсилаються. Якщо очистити дані браузера, прогрес зникне.':'Дані реєстрації та кожен зарахований крок автоматично потрапляють у Google Таблицю методичного відділу. Якщо зникне інтернет, результати збережуться в браузері й надішлються пізніше.'}</p>
  <div class="callout info"><b>Питання щодо курсів</b><p>${esc(CFG.CONTACT||'')}</p></div>
  <p class="tiny">Версія ${esc(CFG.VERSION||'')}</p></div>`);
}

/* ---------- маршрутизація ---------- */
function route(){
  if(!S.user){ viewLogin(); return }
  const p = (location.hash||'#/home').replace(/^#\/?/,'').split('/');
  const ov=$('.overlay'); if(ov) ov.remove();
  if(S.crm){ if(p[0]!=='crm'){ location.hash='#/crm'; return } return window.RS_CRM.route(p.slice(1)) }
  if(p[0]==='crm'){ location.hash='#/home'; return }
  if(p[0]==='schedule' && !S.admin) return window.RS_CRM.teacherRoute(p.slice(1));
  if(p[0]==='admin' && p[1]==='branches' && S.admin) return window.RS_CRM.methodistRoute();
  if(p[0]==='course') return viewCourse(p[1],p[2],p[3]);
  if(p[0]==='courses') return viewCourses();
  if(p[0]==='profile') return viewProfile();
  if(p[0]==='help') return viewHelp();
  if(p[0]==='messages' && !S.admin) return window.RS_ADMIN.viewMessages();
  if(p[0]==='lib') return window.RS_LIB.route(p.slice(1));
  if(p[0]==='admin'){ if(!S.admin){ location.hash='#/home'; return } return window.RS_ADMIN.route(p.slice(1)); }
  if(S.admin && (p[0]==='home'||p[0]==='profile'||p[0]==='messages')) return window.RS_ADMIN.route([]);
  return viewHome();
}
window.addEventListener('hashchange',route);
window.RS_GO = h=>{ location.hash=h };

/* ---------- доступ для модуля адміністратора ---------- */
function unreadReplies(){ const seen=LS.get(KEY+'seen_'+(S.user&&S.user.email),[]); return (LS.get(KEY+'mycache_'+(S.user&&S.user.email),[])||[]).filter(m=>m.reply&&seen.indexOf(m.id)<0).length }
window.RS_CRM_LOGIN = async (login,hash)=>{ const c=Object.assign({},CFG.BRANCH_ADMINS||{},LS.get(KEY+'bcred',{})); const b=Object.keys(c).find(x=>c[x].login===login&&c[x].hash===hash); if(!b) throw new Error('Невірний логін або пароль адміністратора філії.'); return {token:'beta-crm',branch:b,login} };
window.RS_APP = { S, LS, KEY, BETA, CFG, PASS, ALL, COURSES, API, esc, shell, toast, bindGo, courseItems, I, route, signOut, sha256, callApi,
  get EDITS(){ return EDITS }, setEdits(e){ EDITS=e||{}; applyEdits() }, unreadReplies };

/* ---------- старт ---------- */
const th = LS.get('rsa_theme',null); if(th) document.documentElement.setAttribute('data-theme',th);
if(!BETA && !CFG.API_URL) console.warn('RS: режим prod, але API_URL не задано в config.js');
const sess = LS.get(KEY+'session',null);
if(sess && sess.admin && (!sess.adminExp || sess.adminExp<Date.now())){ LS.del(KEY+'session'); viewLogin('admin') }
else if(sess && sess.user){ S.user=sess.user; S.token=sess.token; S.admin=!!sess.admin; S.adminToken=sess.adminToken; S.adminExp=sess.adminExp; S.crm=sess.crm||null; S.progress=LS.get(KEY+'progress_'+sess.user.email,{}); applyEdits(); route();
  if(!S.crm) API.getEdits().then(ed=>{ EDITS=ed||{}; applyEdits(); if(!S.admin) route() });
  if(!BETA && !S.admin && !S.crm) flushOutbox().then(()=>callApi({action:'sync',email:S.user.email,token:S.token})).then(j=>{ S.progress=mergeProgress(S.progress,j.progress||{}); LS.set(KEY+'progress_'+S.user.email,S.progress) }).catch(e=>{ if(/Сесія застаріла/.test(e.message)){ toast('Сесія застаріла — увійдіть знову'); signOut() } }) }
else { viewLogin(); API.getEdits().then(ed=>{ EDITS=ed||{}; applyEdits() }) }


})();
